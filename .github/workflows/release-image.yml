# Build + publish the 108heros Web image to GHCR, then roll it out on K3s.
# Companion to ci.yml (which tests but builds no image).
#
#   deploy/staging  →  staging/jobs-web
#   release/prod    →  prod/jobs-web      ← 108heros.com, REAL USERS

name: release-image

on:
  push:
    branches: [deploy/staging, release/prod]
  workflow_dispatch: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & publish image
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        with:
          driver: docker

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/108-plaza/108heros-web
          tags: |
            type=sha

      - name: Build and push
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  deploy-staging:
    name: Deploy to staging
    needs: image
    if: success() && github.ref == 'refs/heads/deploy/staging'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Resolve image tag
        id: tag
        run: echo "tag=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: 108heros Web → k3s (staging)
        run: |
          set -euo pipefail
          kubectl -n staging set image deploy/jobs-web \
            ting-service=ghcr.io/108-plaza/108heros-web:${{ steps.tag.outputs.tag }}
          kubectl -n staging rollout status deploy/jobs-web --timeout=180s

  deploy-prod:
    name: Deploy to PRODUCTION
    needs: image
    if: success() && github.ref == 'refs/heads/release/prod'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Resolve image tag
        id: tag
        run: echo "tag=sha-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: 108heros Web → k3s (PRODUCTION)
        run: |
          set -euo pipefail
          kubectl -n prod set image deploy/jobs-web \
            ting-service=ghcr.io/108-plaza/108heros-web:${{ steps.tag.outputs.tag }}
          kubectl -n prod rollout status deploy/jobs-web --timeout=180s
