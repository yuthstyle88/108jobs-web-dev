# Helm values for the 108jobs-web application on the ting-service chart, PROD namespace.
#   helm upgrade --install jobs-web charts/ting-service -n prod \
#     -f deploy/k8s/values-prod.yaml --set image.tag=sha-<short>

replicaCount: 1

image:
  repository: ghcr.io/108-plaza/108jobs-web
  # No `tag:` on purpose. This package publishes `sha-<short>` and nothing
  # else -- release-image.yml's metadata step emits `type=sha` only -- so a
  # tag written here would be a tag that does not exist. Writing `latest`
  # here is what put `latest` into the live release and left it unable to be
  # upgraded at all (#112). Always pass the sha on the command line:
  #   --set image.tag=sha-<short>
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: NodePort
  nodePort: 31441
  targetPort: 3000

ingress:
  enabled: false

probes:
  liveness:
    path: /
    initialDelaySeconds: 20
  readiness:
    path: /
    initialDelaySeconds: 10

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 256Mi

securityContext:
  readOnlyRootFilesystem: false

# Non-secret runtime config -> ConfigMap (envFrom). The lane /api/version
# reports as `channel`. release-image.yml also sets this on every deploy
# (`--set config.APP_CHANNEL=...`), so a release upgraded only with
# --reuse-values still carries it.
config:
  APP_CHANNEL: release
