# Helm values for the 108heros-web application on the ting-service chart, STAGING namespace.
#   helm upgrade --install jobs-web charts/ting-service -n staging \
#     -f deploy/k8s/values-staging.yaml --set image.tag=sha-<short>

replicaCount: 1

image:
  repository: ghcr.io/108-plaza/108heros-web
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: NodePort
  nodePort: 30441
  targetPort: 3000

ingress:
  enabled: false

probes:
  liveness:
    path: /
    initialDelaySeconds: 20
  readiness:
    path: /
    initialDelaySeconds: 10

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi

securityContext:
  readOnlyRootFilesystem: false
